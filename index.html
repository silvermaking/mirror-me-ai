<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11141b" />
    <meta
      name="description"
      content="당신의 습관을 읽는 AI 보스를 속이는 짧은 아레나 액션 게임"
    />
    <title>Mirror Me AI</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three-0.180.0/build/three.module.js",
          "three/addons/": "./vendor/three-0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="game-stage" aria-label="Mirror Me AI 전투">
        <canvas
          id="game"
          width="1280"
          height="720"
          tabindex="0"
          role="application"
          aria-label="Mirror Me AI 게임 화면. WASD로 이동하고 J로 공격하며 Space로 대시합니다."
        >
          이 브라우저는 Canvas 게임 화면을 지원하지 않습니다.
        </canvas>

        <section
          id="start-overlay"
          class="start-overlay"
          aria-labelledby="game-title"
          aria-describedby="game-hook"
        >
          <div class="start-copy">
            <p id="loading-copy" class="loading-copy">봉인 지도 전장을 불러오는 중…</p>
            <h1 id="game-title">지도에 없는 왕국</h1>
            <p id="game-hook" class="game-hook">세 번의 회피를 지도에 봉인하게 한 뒤, 지도 밖으로 한 걸음 나아가라.</p>
            <p class="input-prompt">WASD 이동 · SPACE 대시(무적 아님) · J 공격</p>
            <button id="start-button" class="start-button" type="button">아무 전투 입력으로 시작</button>
          </div>
        </section>

        <section id="game-over-overlay" class="game-over-overlay" aria-live="assertive" hidden>
          <p id="game-over-tip">다음에는 위험 구역 밖으로 이동</p>
          <p id="game-over-restart">분석 중…</p>
        </section>

        <button
          id="mute-button"
          class="mute-button"
          type="button"
          aria-label="소리 끄기"
          aria-pressed="false"
        >
          <span class="mute-mark" aria-hidden="true"></span>
          <span class="mute-copy">소리 켬</span>
        </button>

        <div id="status-live" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

        <div id="touch-controls" class="touch-controls" aria-label="터치 조작">
          <div class="touch-dpad" role="group" aria-label="이동">
            <button class="touch-button touch-up" type="button" data-control="up" aria-label="위로 이동">↑</button>
            <button class="touch-button touch-left" type="button" data-control="left" aria-label="왼쪽으로 이동">←</button>
            <button class="touch-button touch-down" type="button" data-control="down" aria-label="아래로 이동">↓</button>
            <button class="touch-button touch-right" type="button" data-control="right" aria-label="오른쪽으로 이동">→</button>
          </div>
          <div class="touch-actions" role="group" aria-label="전투 행동">
            <button class="touch-button touch-attack" type="button" data-control="attack">공격</button>
            <button class="touch-button touch-dash" type="button" data-control="dash">대시</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
