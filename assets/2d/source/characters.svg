      <path d="M5 55 Q7 34 20 18 Q34 9 47 20 Q57 33 50 48 L44 58 Q32 62 20 58 Z" fill="url(#ink-depth)" stroke="#070d13" stroke-width="2.4" stroke-linejoin="round"/>
