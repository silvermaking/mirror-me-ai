      <path d="M35 17 Q41 11 46 19 L48 29 L34 30 Z" fill="#f8f6e8" stroke="#112754" stroke-width="2"/>
      <path d="M46 32 L55 26 L60 31 L49 39" fill="none" stroke="#f7fbfb" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M55 26 L63 21 L60 31" fill="none" stroke="#cfaf60" stroke-width="2.2"/>
    </g>
    <!-- Contact pose. The renderer owns the one tapered boundary blade; this silhouette only carries the hand and hilt. -->
    <g id="player-attack-contact">
      <ellipse cx="30" cy="60" rx="21" ry="3.5" fill="#07101c" opacity=".38"/>
      <path d="M17 56 Q24 33 35 17 Q45 11 53 23 L57 39 L48 57 L37 60 L28 54 L22 61 Z" fill="url(#cobalt-cloak)" stroke="#091943" stroke-width="2.3" stroke-linejoin="round"/>
