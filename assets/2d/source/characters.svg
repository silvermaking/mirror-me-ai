      <path d="M41 32 L43 39" fill="none" stroke="#cfaf60" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- Boss: asymmetric map robes wrap a deep ink body. The crown and compass-stamp are visibly attached in every state. -->
