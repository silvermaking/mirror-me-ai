      <path d="M8 56 Q8 36 19 20 Q31 9 45 17 Q56 26 52 43 L47 56 Q39 61 26 59 L17 55 Z" fill="url(#ink-depth)" stroke="#070d13" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M11 47 Q15 25 27 17 Q34 15 34 26 L29 47 L23 57 L15 53 Z" fill="url(#ivory-map)" stroke="#786441" stroke-width="2.1" stroke-linejoin="round"/>
      <path d="M40 20 Q51 24 53 39 L47 54 L38 50 L36 37 Z" fill="#d6c69d" stroke="#786441" stroke-width="2.1" stroke-linejoin="round"/>
