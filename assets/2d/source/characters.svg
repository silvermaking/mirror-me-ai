      <path d="M9 56 Q5 42 12 25 Q20 14 31 21 L40 39 L36 57 L29 60 L21 55 L15 61 Z" fill="url(#cobalt-cloak)" stroke="#091943" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M18 40 L11 56 L18 61 L27 47 L33 60 L40 56 L31 35" fill="#173575" stroke="#0d2456" stroke-width="1.5"/>
      <path d="M19 17 Q26 9 32 18 L35 30 L20 30 Z" fill="#f8f6e8" stroke="#112754" stroke-width="2"/>
