      <path d="M39 34 L45 29" fill="none" stroke="#e9d092" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M40 30 L45 35" fill="none" stroke="#cfaf60" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g id="player-attack-windup">
      <ellipse cx="31" cy="60" rx="19" ry="3.5" fill="#07101c" opacity=".38"/>
      <path d="M8 56 Q7 40 14 25 Q22 13 33 21 L37 40 L37 57 L31 60 L22 55 L16 61 Z" fill="url(#cobalt-cloak)" stroke="#091943" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M19 40 L12 56 L19 61 L27 46 L33 60 L39 56 L32 35" fill="#173575" stroke="#0d2456" stroke-width="1.5"/>
