      <path d="M4 24 L11 29 M4 34 L12 35" stroke="#c64a3c" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Gallery only. The generator selects individual pose ids; it never crops this review layout. -->
  <g aria-label="player-pose-gallery"><use href="#player-idle" x="0"/><use href="#player-move" x="64"/><use href="#player-dash" x="128"/><use href="#player-attack-windup" x="192"/><use href="#player-attack-contact" x="256"/><use href="#player-attack-recoil" x="320"/></g>
  <g aria-label="boss-pose-gallery" transform="translate(0 64)"><use href="#boss-idle" x="0"/><use href="#boss-watch" x="64"/><use href="#boss-lock" x="128"/><use href="#boss-stamp" x="192"/><use href="#boss-open" x="256"/><use href="#boss-recoil" x="320"/></g>
</svg>
