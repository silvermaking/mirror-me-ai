      <path d="M8 56 Q8 37 19 21 Q30 10 43 17 Q55 25 53 41 L48 56 Q39 61 27 59 L18 55 Z" fill="url(#ink-depth)" stroke="#070d13" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M11 47 Q15 25 28 17 Q37 15 42 25 L37 53 L24 57 L15 53 Z" fill="url(#ivory-map)" stroke="#786441" stroke-width="2.1" stroke-linejoin="round"/>
      <path d="M42 23 Q52 25 53 39 L47 54 L38 50 L36 37 Z" fill="#d6c69d" stroke="#786441" stroke-width="2.1" stroke-linejoin="round"/>
      <path d="M19 34 Q28 28 38 33 L41 42 L27 44 L18 40 Z" fill="#080e14"/>
      <path d="M20 34 Q26 27 31 19 L35 31 L44 14 L42 34" fill="none" stroke="#d6b86f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M42 40 Q52 37 58 33" fill="none" stroke="#e6d29a" stroke-width="6.8" stroke-linecap="round"/>
      <circle cx="59" cy="32" r="7" fill="url(#seal-red)" stroke="#641c1c" stroke-width="2.2"/><circle cx="59" cy="32" r="2.2" fill="#ffe4b4"/>
      <path d="M17 44 Q25 37 36 44 M17 50 L32 52" fill="none" stroke="#aa9160" stroke-width="1.1" opacity=".76"/>
    </g>
