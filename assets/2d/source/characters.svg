<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 128" width="448" height="128">
  <title>Authored 2D whole-body key poses — the boundary runner and the Unmapped Cartographer</title>
  <desc>All pose groups use a local 64 by 64 coordinate system. Their feet sit at y=60, so runtime placement stays tied to the floor-plane anchor.</desc>
  <defs>
    <linearGradient id="cobalt-cloak" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#4d76c4"/><stop offset=".48" stop-color="#244b9d"/><stop offset="1" stop-color="#10255d"/></linearGradient>
    <linearGradient id="ivory-map" x1=".05" y1="0" x2=".95" y2="1"><stop stop-color="#fff9e7"/><stop offset=".55" stop-color="#ece0bd"/><stop offset="1" stop-color="#b99d6a"/></linearGradient>
    <linearGradient id="ink-depth" x1=".2" y1="0" x2=".85" y2="1"><stop stop-color="#303942"/><stop offset=".5" stop-color="#151b22"/><stop offset="1" stop-color="#070b10"/></linearGradient>
    <linearGradient id="seal-red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d45b46"/><stop offset="1" stop-color="#7c1f1e"/></linearGradient>

    <!-- Player: a single rooted body. Each sword path ends in a broken boundary tip; no detached weapon layer is needed to read the pose. -->
    <g id="player-idle">
      <ellipse cx="31" cy="60" rx="17" ry="3.5" fill="#07101c" opacity=".38"/>
      <path d="M18 56 L20 35 Q21 19 31 13 Q42 18 45 34 L44 56 L36 60 L29 56 L25 61 Z" fill="url(#cobalt-cloak)" stroke="#091943" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M24 39 L20 56 L27 61 L32 45 L37 60 L45 56 L40 37" fill="#173575" stroke="#0d2456" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M26 17 Q31 10 37 17 L39 29 L25 29 Z" fill="#f8f6e8" stroke="#112754" stroke-width="2"/>
      <path d="M28 22 L35 22" stroke="#b9cbd4" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M41 34 L50 26 L54 30 L45 40" fill="none" stroke="#f7fbfb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M50 26 L59 21 L55 30" fill="none" stroke="#cfaf60" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
    <g id="player-move">
      <ellipse cx="29" cy="60" rx="19" ry="3" fill="#07101c" opacity=".35"/>
      <path d="M15 55 Q17 35 24 22 Q34 13 44 21 L49 36 L43 57 L34 60 L26 54 L21 61 Z" fill="url(#cobalt-cloak)" stroke="#091943" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M25 39 L16 56 L23 61 L31 45 L38 59 L47 55 L40 36" fill="#173575" stroke="#0d2456" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M29 16 Q35 10 40 18 L43 29 L29 30 Z" fill="#f8f6e8" stroke="#112754" stroke-width="2"/>
      <path d="M42 33 L52 37 L55 32 L44 27" fill="none" stroke="#f7fbfb" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M52 37 L61 37 L55 32" fill="none" stroke="#cfaf60" stroke-width="2.2"/>
    </g>
    <g id="player-dash">
      <path d="M3 48 L21 48 M7 53 L25 53 M13 58 L28 58" stroke="#4d76c4" stroke-width="2.4" stroke-linecap="round" opacity=".72"/>
      <ellipse cx="34" cy="60" rx="20" ry="3" fill="#07101c" opacity=".32"/>
      <path d="M20 55 Q21 34 31 20 Q43 16 51 28 L47 52 L38 60 L28 54 L23 61 Z" fill="url(#cobalt-cloak)" stroke="#091943" stroke-width="2.2" stroke-linejoin="round"/>
