      <path d="M11 56 Q8 39 17 23 Q24 11 36 13 Q51 17 54 35 L50 55 Q42 61 31 60 L21 57 Z" fill="url(#ink-depth)" stroke="#070d13" stroke-width="2.4" stroke-linejoin="round"/>
