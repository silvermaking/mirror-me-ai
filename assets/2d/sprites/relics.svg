<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <title>Authored 2D map relic sprites</title>
  <defs><linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4cf"/><stop offset="1" stop-color="#b99d6a"/></linearGradient></defs>
  <!-- Same-sized memory plaque: reuse this frame exactly three times, with one silver pin per sample. -->
  <g id="memory-plaque"><rect x="4" y="8" width="40" height="30" rx="5" fill="url(#plate)" stroke="#766342" stroke-width="2"/><path d="M10 17 Q19 11 28 17 T39 17 M10 28 L38 28" fill="none" stroke="#c3a95f" stroke-width="1.4"/><path d="M24 6 V14" stroke="#c8d1d2" stroke-width="2"/><circle cx="24" cy="6" r="3" fill="#edf2f1" stroke="#778184" stroke-width="1"/></g>
  <!-- Fixed target and driver must share their ground coordinate in the renderer. -->
  <g id="lock-seal" transform="translate(48)"><circle cx="24" cy="24" r="17" fill="#b73325" stroke="#6f201b" stroke-width="3"/><path d="M15 24 H33 M24 15 V33" stroke="#f5d9aa" stroke-width="2"/><circle cx="24" cy="24" r="6" fill="none" stroke="#e9be80" stroke-width="1.5"/></g>
  <g id="blank-core" transform="translate(96)"><path d="M24 5 L39 15 L37 33 L24 43 L10 33 L9 15 Z" fill="#ffffff" stroke="#e6f0f4" stroke-width="3"/><path d="M24 10 V38 M14 20 L34 30 M34 20 L14 30" stroke="#f6fbff" stroke-width="1.5"/></g>
  <g id="danger" transform="translate(144)"><ellipse cx="24" cy="29" rx="19" ry="10" fill="#c87a67" opacity=".28" stroke="#b55043" stroke-width="2"/><ellipse cx="24" cy="29" rx="11" ry="5" fill="none" stroke="#d89a84" stroke-width="1.2"/></g>
  <g id="compass-driver" transform="translate(192)"><path d="M24 3 V28" stroke="#c7ab6a" stroke-width="7" stroke-linecap="round"/><path d="M13 12 L24 3 L35 12" fill="none" stroke="#e5c77d" stroke-width="3"/><circle cx="24" cy="34" r="10" fill="#b73325" stroke="#6f201b" stroke-width="3"/><circle cx="24" cy="34" r="3" fill="#f4d8a7"/></g>
</svg>
